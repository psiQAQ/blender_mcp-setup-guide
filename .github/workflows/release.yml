name: Publish validated integration

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful Validate Extension CI run ID for this exact commit
        type: string
        required: true
      release_tag:
        description: Existing Git tag matching the validated version and commit (for example v1.0.3+integration.1)
        type: string
        required: true
      channel:
        description: Validated source channel (main snapshots require preview)
        type: choice
        options: [stable, preview]
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  publish-assets:
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
      channel_path: ${{ steps.channel.outputs.path }}
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
      pages: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B scripts/ci_setup.py
      - name: Require the exact successful CI run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: python -B scripts/verify_ci_run.py --run-id $env:VALIDATION_RUN_ID
      - uses: actions/download-artifact@v4
        with:
          pattern: validated-*
          path: build/latest/validated
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run_id }}
      - id: pages
        uses: actions/configure-pages@v5
      - id: channel
        name: Resolve the pinned publication channel
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          python -B -c "import json,os,sys; sys.path.insert(0,'scripts'); from upstream_source import channel_path,release_channel; record=json.load(open('packaging/upstream.json')); assert release_channel(record)==os.environ['RELEASE_CHANNEL']; path=channel_path(record); open(os.environ['GITHUB_OUTPUT'],'a').write('path='+path+'\n'); open(os.environ['GITHUB_ENV'],'a').write('CHANNEL_PATH='+('/'+path if path else '')+'\n')"
      - name: Arrange platform artifacts
        run: |
          foreach ($platform in @('windows-x64', 'linux-x64', 'macos-arm64')) {
            Move-Item "build/latest/validated/validated-$platform" "build/latest/validated/$platform"
          }
      - name: Upload draft assets, read back every asset and validate the complete index
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: '& $env:BLENDER_PYTHON -B scripts/publish_release.py --phase stage --channel $env:RELEASE_CHANNEL --repository $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG --expected-commit $env:GITHUB_SHA --artifacts build/latest/validated --blender $env:BLENDER --index-output build/latest/release-repository --current-url "$env:PAGES_BASE$env:CHANNEL_PATH/publication.json"'
      - name: Compose the full site and verify retained channel assets
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}
        run: python -B scripts/pages_site.py --base-url $env:PAGES_BASE --candidate build/latest/release-repository --site build/latest/site
      - name: Publish the validated Release and read back public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          python -B scripts/pages_site.py --base-url $env:PAGES_BASE --site build/latest/site
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BLENDER_PYTHON -B scripts/publish_release.py --phase finalize --channel $env:RELEASE_CHANNEL --repository $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG --expected-commit $env:GITHUB_SHA --artifacts build/latest/validated --index-output build/latest/release-repository --current-url "$env:PAGES_BASE$env:CHANNEL_PATH/publication.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-extension-index
          path: build/latest/site/
          if-no-files-found: error
  deploy-index:
    needs: publish-assets
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-extension-index
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-publication:
    needs: [deploy-index, publish-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Linux libraries
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libxkbcommon0 libxi6 libxrender1 libxxf86vm1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B scripts/ci_setup.py --platform ${{ matrix.platform }}
      - uses: actions/download-artifact@v4
        with:
          pattern: validated-*
          path: build/latest/validated
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run_id }}
      - name: Arrange platform artifacts
        run: |
          foreach ($platform in @('windows-x64', 'linux-x64', 'macos-arm64')) {
            Move-Item "build/latest/validated/validated-$platform" "build/latest/validated/$platform"
          }
      - name: Install from the public index and call the real MCP
        env:
          PAGES_BASE: ${{ needs.publish-assets.outputs.base_url }}
          CHANNEL_PATH: ${{ needs.publish-assets.outputs.channel_path }}
        run: |
          $indexUrl = "$env:PAGES_BASE/index.json"
          if ($env:CHANNEL_PATH) { $indexUrl = "$env:PAGES_BASE/$env:CHANNEL_PATH/index.json" }
          & $env:BLENDER_PYTHON -B scripts/test_repository.py --blender $env:BLENDER --artifacts build/latest/validated --public-index $indexUrl
      - uses: actions/download-artifact@v4
        with:
          name: verified-extension-index
          path: build/latest/site
      - name: Verify retained indexes and assets after deployment
        env:
          PAGES_BASE: ${{ needs.publish-assets.outputs.base_url }}
        run: python -B scripts/pages_site.py --base-url $env:PAGES_BASE --site build/latest/site --deployed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-${{ matrix.platform }}
          path: |
            build/latest/published-tests.json
            build/latest/evidence/**/blender.log
          if-no-files-found: error
  archive-publication:
    needs: [verify-publication, publish-assets]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: publication-*
          path: build/latest/publication-reports
      - uses: actions/download-artifact@v4
        with:
          name: verified-extension-index
          path: build/latest/site
      - name: Archive verified public installations as an immutable Release receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_PATH: ${{ needs.publish-assets.outputs.channel_path }}
        run: |
          publication="build/latest/site/publication.json"
          if [ -n "$CHANNEL_PATH" ]; then publication="build/latest/site/$CHANNEL_PATH/publication.json"; fi
          python -B scripts/publication_receipt.py --publication "$publication" --reports build/latest/publication-reports --output build/latest/publication-receipts --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --upload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-receipt
          path: build/latest/publication-receipts/*.zip
          if-no-files-found: error
